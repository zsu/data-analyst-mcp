name: publish

# Publishes to npm when a version tag is pushed, for example: npm version patch && git push --follow-tags
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow as the trusted publisher and attach provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs (11.5.1 or later)
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm (skipped when this version is already there, so a re-run can finish the registry step)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "data-analyst-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "data-analyst-mcp@$VERSION is already on npm; skipping npm publish"
          else
            npm publish --access public
          fi

      # List the release in the official MCP Registry (registry.modelcontextprotocol.io), which many MCP
      # directories mirror. Signs in with this workflow's GitHub OIDC token, so no secret is stored.
      # server.json's name must match package.json's mcpName.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set server.json version from the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      # The registry checks mcpName in the published npm package, and a new version can take minutes to appear.
      - name: Wait for the npm version to be visible
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 40); do
            got="$(curl -fsS "https://registry.npmjs.org/data-analyst-mcp/$VERSION" | jq -r '.mcpName // empty' || true)"
            if [ -n "$got" ]; then echo "npm has $VERSION with mcpName $got"; exit 0; fi
            echo "waiting for data-analyst-mcp@$VERSION on npm ($i/40)"; sleep 15
          done
          echo "::error::data-analyst-mcp@$VERSION with mcpName is not on npm after 10 minutes"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher publish
