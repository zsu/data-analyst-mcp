name: publish

# Publishes to npm and the MCP Registry for each new version. Three ways in:
#   - a version bump lands on main (package.json changed): the tag job creates tag v<version> if it is new,
#     then publish runs in the same workflow run (a tag pushed with GITHUB_TOKEN starts no workflow of its own);
#   - a v* tag is pushed by hand (npm version patch && git push --follow-tags);
#   - Run workflow (workflow_dispatch) on main: tags and publishes the current version if its tag is missing.
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
on:
  push:
    branches: [main]
    paths: [package.json]   # not evaluated for tag pushes
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag
    outputs:
      created: ${{ steps.tag.outputs.created }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create tag v<version> if it is new
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    # a pushed v* tag (the tag job is skipped), or a tag the tag job just created
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/v') ||
      (needs.tag.result == 'success' && needs.tag.outputs.created == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow as the trusted publisher and attach provenance
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.tag.outputs.version) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then echo "::error::tag $TAG but package.json has $VERSION"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs (11.5.1 or later)
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm (skipped when this version is already there, so a re-run can finish the registry step)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "data-analyst-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "data-analyst-mcp@$VERSION is already on npm; skipping npm publish"
          else
            npm publish --access public
          fi

      # List the release in the official MCP Registry (registry.modelcontextprotocol.io), which many MCP
      # directories mirror. Signs in with this workflow's GitHub OIDC token, so no secret is stored.
      # server.json's name must match package.json's mcpName.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set server.json version from the tag
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      # The registry checks mcpName in the published npm package, and a new version can take minutes to appear.
      - name: Wait for the npm version to be visible
        run: |
          for i in $(seq 1 40); do
            got="$(curl -fsS "https://registry.npmjs.org/data-analyst-mcp/$VERSION" | jq -r '.mcpName // empty' || true)"
            if [ -n "$got" ]; then echo "npm has $VERSION with mcpName $got"; exit 0; fi
            echo "waiting for data-analyst-mcp@$VERSION on npm ($i/40)"; sleep 15
          done
          echo "::error::data-analyst-mcp@$VERSION with mcpName is not on npm after 10 minutes"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher publish
